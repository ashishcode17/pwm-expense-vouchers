// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { subproject ->
    subproject.configurations.configureEach { configuration ->
        // kotlin-stdlib 1.8+ already includes jdk7/jdk8 APIs.
        // Old kotlin-stdlib-jdk7/jdk8:1.6.21 jars cause duplicate class errors.
        configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        configuration.exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.9.24'
                details.because 'Align all Kotlin artifacts to one version'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
